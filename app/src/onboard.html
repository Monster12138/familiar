<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familiar</title>
    <link rel="stylesheet" href="./settings.css">
    <link rel="stylesheet" href="./onboard.css">
</head>
<body>
    <div class="onboard">
        <header class="onboard-hero">
            <img src="../src-tauri/icons/icon.png" alt="Familiar" class="onboard-logo">
            <h1 data-i18n="onboard_title">欢迎使用 Familiar</h1>
            <p class="onboard-subtitle" data-i18n="onboard_subtitle">一只会回应你工作世界的桌面宠物</p>
        </header>

        <ol class="onboard-steps">
            <li data-i18n="onboard_step_1">桌宠会随 Agent 的工作活动产生变化</li>
            <li data-i18n="onboard_step_2">注入 Hooks 即可同步 Agent 状态</li>
            <li data-i18n="onboard_step_3">数据只在本机处理，隐私优先</li>
        </ol>

        <section class="onboard-agents">
            <h2 data-i18n="onboard_agents_title">连接你的 Agent（可选）</h2>
            <div id="onboard-agent-list" class="onboard-agent-list"></div>
        </section>

        <footer class="onboard-footer">
            <button id="btn-onboard-start" class="primary-btn" data-i18n="onboard_start">开始使用</button>
            <button id="btn-onboard-skip" class="secondary-btn" data-i18n="onboard_skip">跳过</button>
        </footer>
    </div>

    <!-- Hook inject preview modal (mirrors the settings panel) -->
    <div id="onboard-hook-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content diff-modal-content">
            <h3 data-i18n="onboard_modal_title">确认注入 Hooks</h3>
            <p data-i18n="onboard_modal_desc" style="color:var(--text-muted);font-size:13px;margin: 8px 0 16px;">以下配置将合并到 Agent 配置文件中，我们会先自动生成一个 .bak 备份。</p>

            <div class="diff-viewer">
                <div class="diff-pane">
                    <div class="diff-header">Before</div>
                    <pre><code id="onboard-inject-before" class="code-preview"></code></pre>
                </div>
                <div class="diff-pane">
                    <div class="diff-header">After</div>
                    <pre><code id="onboard-inject-after" class="code-preview"></code></pre>
                </div>
            </div>

            <div class="modal-actions">
                <button class="secondary-btn" id="btn-onboard-inject-cancel" data-i18n="btn_cancel">取消</button>
                <button class="primary-btn" id="btn-onboard-inject-confirm" data-i18n="btn_confirm_inject">确认</button>
            </div>
        </div>
    </div>

    <script src="./onboard.js" type="module"></script>
</body>
</html>
