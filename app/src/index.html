<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Familiar</title>
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./stats.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: transparent !important;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
      }
      #unified-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        pointer-events: auto;
        transform-origin: top left;
        width: max-content;
        box-sizing: border-box;
        /* Hover transparency is applied here (not on <body>) so the context
           menu, a sibling of this container, always stays opaque. Starts hidden
           until config loads to avoid a flash of unstyled content. */
        opacity: 0;
        transition: opacity 0.15s ease;
        /* The glass frame is this container's own border (toggled via the
           .show-frame class), so it hugs the content by construction. The
           border is always present — transparent when off — so toggling
           never changes the window size. */
        border: 1.5px solid transparent;
        border-radius: 10px;
        padding: 2px;
      }
      #unified-container.show-frame {
        border-color: rgba(255, 255, 255, 0.45);
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.12),
          inset 0 0 16px rgba(255, 255, 255, 0.08);
      }
      #bubble-container {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding: 4px;
        gap: 6px;
        width: 160px;
        box-sizing: border-box;
        height: max-content;
      }
      /* No bubble present: collapse the reserved space entirely so the window
         hugs the pet. It re-expands automatically once a bubble is appended. */
      #bubble-container:empty {
        width: 0;
        height: 0;
        padding: 0;
      }
      #runtime-mode-bar {
        display: none;
        width: 100%;
        height: 26px;
        box-sizing: border-box;
        align-items: center;
        justify-content: flex-end;
        padding: 2px 4px;
      }
      #runtime-mode-badge {
        display: block;
        width: 22px;
        height: 22px;
        padding: 3px;
        box-sizing: border-box;
        pointer-events: none;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.96);
        background: rgba(37, 99, 235, 0.82);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      }
      #runtime-mode-badge svg { width: 100%; height: 100%; }
      #runtime-mode-badge[data-status="connecting"],
      #runtime-mode-badge[data-status="reconnecting"] {
        background: rgba(217, 119, 6, 0.86);
      }
      #runtime-mode-badge[data-status="offline"],
      #runtime-mode-badge[data-status="authentication_failed"],
      #runtime-mode-badge[data-status="incompatible_protocol"] {
        background: rgba(185, 28, 28, 0.88);
      }
      .bubble {
        pointer-events: auto;
      }
      #pet-container {
        /* Hug the sprite canvas: fixed widths let the canvas (and the pet's
           tail) escape the container, which made the window frame cut
           across the sprite. */
        width: max-content;
        height: auto;
        position: relative;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #pet-container > * {
        pointer-events: auto;
      }
      #unified-container.hover-hidden {
        opacity: 0;
        transition: opacity 120ms ease;
      }
      #pet-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: max-content;
      }
      #pet-stage[data-dashboard-position="bottom"] {
        flex-direction: column;
      }
      #pet-stage[data-dashboard-position="left"] #stats-container {
        order: -1;
      }
      #pet-stage[data-dashboard-alignment="top"]:is([data-dashboard-position="left"], [data-dashboard-position="right"]) {
        align-items: flex-start;
      }
      #pet-stage[data-dashboard-alignment="center"]:is([data-dashboard-position="left"], [data-dashboard-position="right"]) {
        align-items: center;
      }
      #pet-stage[data-dashboard-alignment="bottom"]:is([data-dashboard-position="left"], [data-dashboard-position="right"]) {
        align-items: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="unified-container">
      <div id="runtime-mode-bar">
        <div id="runtime-mode-badge" aria-live="polite" aria-label="Remote connection">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
            <path d="M8.5 16.05a6 6 0 0 1 7 0"></path>
            <path d="M12 19.5h.01"></path>
          </svg>
        </div>
      </div>
      <!-- 1. Bubble -->
      <div id="bubble-container"></div>
      
      <!-- 2. Pet + dashboard stage -->
      <div id="pet-stage" data-dashboard-position="bottom" data-dashboard-layout="vertical" data-dashboard-alignment="bottom">
        <div id="pet-container"></div>

        <div id="stats-container" data-dashboard-style="classic" data-dashboard-layout="vertical">
          <div class="stat-row">
            <div class="stat-label" data-short-label="C">CPU</div>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" id="bar-cpu"></div>
            </div>
            <div class="stat-val" id="val-cpu">0%</div>
          </div>
          <div class="stat-row">
            <div class="stat-label" data-short-label="M">RAM</div>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" id="bar-ram"></div>
            </div>
            <div class="stat-val" id="val-ram">0%</div>
          </div>
          <div class="stat-row">
            <div class="stat-label" data-short-label="D">DSK</div>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" id="bar-disk"></div>
            </div>
            <div class="stat-val" id="val-disk">0%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu">
      <div class="menu-item" id="menu-settings">
        <svg class="menu-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span data-i18n="menu_settings">设置</span>
      </div>
      <div class="menu-item" id="menu-click-through">
        <svg class="menu-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4"></path>
        </svg>
        <span data-i18n="menu_click_through">鼠标穿透</span>
        <span class="menu-check">✓</span>
      </div>
      <div class="menu-item" id="menu-shuffle" style="display:none;">
        <svg class="menu-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
        <span data-i18n="menu_shuffle">换一只</span>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-item" id="menu-quit">
        <svg class="menu-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
        <span data-i18n="menu_quit">退出</span>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
    <script type="module" src="./bubble.js"></script>
    <script type="module" src="./stats.js"></script>
  </body>
</html>
