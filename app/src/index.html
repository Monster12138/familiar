<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Familiar</title>
    <link rel="stylesheet" href="./index.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* Background MUST be transparent for Tauri to blend it with desktop */
        background-color: transparent !important;
        /* Make background unclickable, only the cat should be clickable if we add pointer-events logic later */
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      #pet-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <div id="pet-container" data-tauri-drag-region></div>

    <!-- Context Menu -->
    <div id="context-menu">
      <div class="menu-item" id="menu-settings">⚙️ Settings</div>
    </div>

    <!-- Settings Modal Removed -->

    <script type="module" src="./main.js"></script>
  </body>
</html>
