<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Familiar</title>
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./stats.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: transparent !important;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
      }
      #unified-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transform-origin: top left;
        width: 160px;
      }
      #bubble-container {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding: 4px;
        gap: 6px;
        width: 100%;
        box-sizing: border-box;
        height: max-content;
        min-height: 80px;
      }
      .bubble {
        pointer-events: auto;
      }
      #pet-container {
        width: 128px;
        height: auto;
        position: relative;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #pet-container > * {
        pointer-events: auto;
      }
      #stats-container {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="unified-container">
      <!-- 1. Bubble -->
      <div id="bubble-container"></div>
      
      <!-- 2. Pet -->
      <div id="pet-container"></div>
      
      <!-- 3. Stats -->
      <div id="stats-container">
        <div class="stat-row">
          <div class="stat-label">CPU</div>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" id="bar-cpu"></div>
          </div>
          <div class="stat-val" id="val-cpu">0%</div>
        </div>
        <div class="stat-row">
          <div class="stat-label">RAM</div>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" id="bar-ram"></div>
          </div>
          <div class="stat-val" id="val-ram">0%</div>
        </div>
        <div class="stat-row">
          <div class="stat-label">DSK</div>
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" id="bar-disk"></div>
          </div>
          <div class="stat-val" id="val-disk">0%</div>
        </div>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu">
      <div class="menu-item" id="menu-settings">
        <svg class="menu-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span data-i18n="menu_settings">设置</span>
      </div>
      <div class="menu-item" id="menu-quit">
        <svg class="menu-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
        <span data-i18n="menu_quit">退出</span>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
    <script type="module" src="./bubble.js"></script>
    <script type="module" src="./stats.js"></script>
  </body>
</html>
