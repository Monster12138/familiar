[package]
name = "familiar-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
familiar-core = { path = "../../crates/familiar-core" }
familiar-api = { path = "../../crates/familiar-api" }
tauri = { version = "2.0.0-rc", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
familiar-hooks = { path = "../../crates/familiar-hooks" }
sysinfo = { workspace = true }
tracing = { workspace = true }
open = "5.4.0"
dirs = "6.0.0"
rfd = "0.15"
# Update checker HTTP client. Reuses the reqwest 0.13 already pulled in by
# tauri. reqwest 0.13 no longer exposes rustls-tls-* aliases and its `rustls`
# feature would pull aws-lc-rs (which needs NASM on Windows x86_64), so native
# TLS is used instead: it is already a build requirement of the workspace
# (familiar-cli compiles reqwest 0.12 with default native-tls), so this adds
# no new system build dependency. Windows uses Schannel, macOS the Security
# framework, Linux the OpenSSL already required by familiar-cli.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
block = "0.1"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[target.'cfg(target_os = "windows")'.dependencies]
# The `windows` crate is already a direct dependency of tauri (its
# WebviewWindow::hwnd() returns windows::Win32::Foundation::HWND), so this only
# enables the extra Win32 UI features needed by the Windows hover hook in
# desktop_pet_window.rs.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }
