[package]
name = "familiar-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
familiar-core = { path = "../../crates/familiar-core" }
familiar-api = { path = "../../crates/familiar-api" }
tauri = { version = "2.0.0-rc", features = ["macos-private-api", "tray-icon", "image-png"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
familiar-hooks = { path = "../../crates/familiar-hooks" }
sysinfo = { workspace = true }
tracing = { workspace = true }
open = "5.4.0"
dirs = "6.0.0"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }
