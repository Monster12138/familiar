[general]
language = "zh-CN"
data_retention_days = 90
onboarded = false

[runtime]
mode = "local"

[hooks]
enabled = [
    "claude-code",
    "codex",
]
socket_path = "/tmp/familiar.sock"
tcp_port = 19527

[renderer]
enabled = [
    "desktop-pet",
    "menu-bar",
]

[renderer.desktop-pet]
sprite = "tabby-cat"
scale = 1.3
position = "bottom-right"
always_on_top = true
show_on_all_desktops = true
opacity = 1.0
show_task_bubble = true
show_pet = true
show_dashboard = true
click_through = false
show_window_frame = false
dashboard_style = "classic"
dashboard_position = "bottom"
dashboard_layout = "vertical"
dashboard_alignment = "bottom"
celebration_secs = 10
sleep_timeout_secs = 300

# Optional event → pet status overrides. Keys are AgentEventType kinds
# (AgentStarted, Thinking, Processing, ReadingFile, WritingFile,
# RunningCommand, SearchingCode, BrowsingWeb, TaskCompleted, TaskFailed,
# WaitingForInput, SubagentStarted, SubagentStopped); values are one of
# idle, thinking, working, pending, completed, failed. Missing
# entries keep the built-in behavior. AgentStopped is not mappable.
# Managed from Settings → Event Behaviors; example:
#   [renderer.desktop-pet.event_status_map]
#   Thinking = "working"
#   TaskCompleted = "idle"

[renderer.menu-bar]
show_active_count = true
show_today_stats = true

[renderer.dashboard]
port = 9527

[api]
enabled = true
port = 19528

[server]
# Used by `familiar-cli serve`; set FAMILIAR_CONFIG or pass --config when the
# server and desktop client use separate configuration files.
bind = "127.0.0.1:19528"

[server.tls]
enabled = false

[server.auth]
enabled = false

[server.state_stream]
max_updates_per_second = 10
max_task_summary_chars = 160
max_activity_summary_chars = 160

[remote]
path = "/api/v1/state-stream"
tls = false
connect_timeout_secs = 10
reconnect_initial_secs = 1
reconnect_max_secs = 30

[notifications]
dnd_start = "22:00"
dnd_end = "08:00"
min_level = "info"

[achievements]
enabled = true

[sessions]
hidden_sessions = []

[cleanup]
backup_files = true
log_files = true
age_days = 90

[update]
check_on_startup = true
interval = "daily"
ignored_versions = []
# skipped_version and last_check_at are written by the app at runtime and
# do not appear in the default file.
