[general]
language = "zh-CN"
data_retention_days = 90

[hooks]
enabled = [
    "claude-code",
    "codex",
]
socket_path = "/tmp/familiar.sock"
tcp_port = 19527

[renderer]
enabled = [
    "desktop-pet",
    "menu-bar",
]

[renderer.desktop-pet]
sprite = "tabby-cat"
scale = 1.3
position = "bottom-right"
always_on_top = true
show_on_all_desktops = true
opacity = 1.0
show_task_bubble = true
show_pet = true
show_dashboard = true
dashboard_style = "classic"
dashboard_position = "bottom"
dashboard_layout = "vertical"
dashboard_alignment = "bottom"
celebration_secs = 10
sleep_timeout_secs = 300

[renderer.menu-bar]
show_active_count = true
show_today_stats = true

[renderer.dashboard]
port = 9527

[api]
enabled = true
port = 19527

[notifications]
dnd_start = "22:00"
dnd_end = "08:00"
min_level = "info"

[achievements]
enabled = true

[sessions]
hidden_sessions = []
