name: Publish Tauri release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-tauri:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
            signing_identity: "-"
          - name: macOS x64
            platform: macos-15-intel
            args: --bundles app,dmg
            rust_targets: ""
            signing_identity: "-"
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust_targets: ""
            signing_identity: ""
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            rust_targets: ""
            signing_identity: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: Familiar v__VERSION__
          releaseBody: |
            Multi-platform bundles generated from ${{ github.ref_name }}.

            Review platform signing status and checksums before publishing this draft.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
