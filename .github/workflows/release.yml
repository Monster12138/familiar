name: Publish Tauri release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.4.1
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create draft release if missing
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; build jobs will upload assets to it."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Familiar $RELEASE_TAG" \
              --draft \
              --notes "Multi-platform bundles generated from $RELEASE_TAG. Review platform signing status and checksums before publishing this draft."
          fi

  publish-tauri:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            platform_slug: macos
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
            signing_identity: "-"
          - name: macOS x64
            platform: macos-15-intel
            platform_slug: macos
            args: --bundles app,dmg
            rust_targets: ""
            signing_identity: "-"
          - name: Linux x64
            platform: ubuntu-22.04
            platform_slug: linux
            args: --bundles deb,appimage
            rust_targets: ""
            signing_identity: ""
          - name: Windows x64
            platform: windows-latest
            platform_slug: windows
            args: --bundles nsis
            rust_targets: ""
            signing_identity: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri bundles
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        with:
          projectPath: app
          args: ${{ matrix.args }}

      # Tauri default artifact names only contain the architecture and not the platform, so uniformly insert the platform name after the version number to make it easier to distinguish the target system from the Release attachments
      - name: Rename artifacts with platform name
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
          PLATFORM_SLUG: ${{ matrix.platform_slug }}
        run: |
          mkdir -p renamed-artifacts
          node -e '
            const fs = require("fs");
            const path = require("path");
            const paths = JSON.parse(process.env.ARTIFACT_PATHS);
            const version = process.env.RELEASE_TAG.replace(/^v/, "");
            for (const artifact of paths) {
              const base = path.basename(artifact);
              const renamed = base.replace(`_${version}_`, `_${version}_${process.env.PLATFORM_SLUG}_`);
              fs.copyFileSync(artifact, path.join("renamed-artifacts", renamed));
              console.log(`${base} -> ${renamed}`);
            }
          '

      - name: Upload artifacts to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: renamed-artifacts/*
