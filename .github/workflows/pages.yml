name: Deploy website to GitHub Pages

# Builds the static site under `website/` and publishes it to GitHub Pages at
# https://<owner>.github.io/familiar/. First-time setup requires enabling
# Pages in the repository: Settings → Pages → Build and deployment →
# Source: GitHub Actions (one manual step, then this workflow owns deploys).

on:
  push:
    branches: ["main"]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
